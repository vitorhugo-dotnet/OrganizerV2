# OrganizerV2 — example configuration
# Copy this to ~/.config/organizerv2/config.yaml and adjust paths.
# Run `organizer config init` to write the defaults automatically.

# Directories to watch. target_base is where category subfolders are created.
# Use ~ for your home directory. You can list multiple entries.
watch_paths:
  - path: ~/Downloads
    target_base: ~/Downloads

# How long a file must be quiet before it is treated as a finished download and
# moved. Raise these on a slow disk or a slow connection; every value is in
# milliseconds and a value of 0 or less falls back to the default shown here.
stability:
  # Wait this long after the last filesystem event before looking at a file.
  debounce_ms: 500
  # Interval between the two samples compared to decide the file stopped
  # growing. Also the delay between retries.
  window_ms: 2000
  # How old the last write must be before a file may be moved.
  min_age_ms: 2000
  # How many *consecutive* checks with no progress to make before giving up.
  # The counter resets whenever the file grows, so a long download is never
  # abandoned midway; this only bounds a transfer that has truly stalled.
  max_checks: 30
  # How many times to retry a move that failed because another process still
  # held the file open. Retries back off exponentially from window_ms.
  move_retries: 3

# Deprecated: unused. fsnotify is always used; there is no polling fallback.
poll_interval_seconds: 2

# Classification rules: map categories to lists of file extensions.
# Extensions are case-insensitive. Add/remove entries with:
#   organizer config rules add --category MyCategory --ext .xyz
#   organizer config rules remove --ext .xyz
rules:
  - category: Image
    extensions: [.jpg, .jpeg, .png, .gif, .bmp, .svg, .webp, .tiff, .ico,
                 .heic, .heif, .avif, .psd, .tga, .cr2, .nef, .arw]
  - category: Executables
    extensions: [.exe, .msi, .deb, .appimage, .bat, .cmd, .ps1,
                 .msix, .msixbundle, .appx, .appxbundle]
  - category: Documents
    extensions: [.pdf, .doc, .docx, .xls, .xlsx, .ppt, .pptx, .txt,
                 .odt, .ods, .odp, .csv, .rtf, .md]
  - category: Compacted
    extensions: [.zip, .rar, .7z, .tar, .gz, .bz2, .xz, .zst, .tgz, .zipx]
  - category: ISO
    extensions: [.iso, .img, .vhd, .vhdx]
  - category: Torrent
    extensions: [.torrent]
  - category: Video
    extensions: [.mkv, .mp4, .avi, .mov, .webm, .flv, .wmv, .m4v, .mpg, .mpeg]
  - category: Audio
    extensions: [.wav, .mp3, .flac, .aac, .ogg, .m4a, .wma, .opus]
  - category: Script
    extensions: [.py, .pyw, .js, .ts, .tsx, .go, .rs, .rb, .sh, .java, .c,
                 .cpp, .json, .yml, .yaml, .toml, .ini, .html, .css, .scss,
                 .vue, .php]

# Extensions that are NEVER moved (incomplete/temporary download artifacts).
# The watcher skips these on sight, on top of a built-in floor of browser
# extensions (.crdownload, .part, .download, .opdownload, .partial, .tmp) that
# applies even if you empty this list.
ignore_extensions:
  - .tmp
  - .!qB
  - .!qb
  - .!ut
  - .fdmdownload
  - .opdownload
  - .crdownload
  - .aria2
  - .part
  - .download
  - .partial
  - .downloading
  - .filepart
  - .tmpfile
  - .!sync

# Files with unrecognised extensions go here.
fallback_category: Others

# Desktop notifications after each move.
notifications:
  enabled: true
  actions:
    # Shows the Open File button in the Windows toast.
    open_file: true
    # Shows Open Location, which selects the organized file in Explorer.
    open_location: true
    # Retained for platform compatibility; not shown in the Python-style Windows toast.
    copy_path: true
    # Adds configured shortcuts to the Windows "Move file to" selection.
    # Open File/Open Location move the file first when another destination is selected.
    move_to: true
    # Retained for callback compatibility; no separate Copy To button is displayed.
    copy_to: true
    # Shows Confirm, which dismisses the event without changing the file.
    confirm: true

  # Windows-only named destinations shown after the current category in "Move file to".
  # Paths are normalized to absolute paths. Arbitrary destinations are rejected.
  shortcuts:
    - name: Desktop
      path: ~/Desktop
    - name: Documents
      path: ~/Documents

# Logging: "debug" | "info" | "warn" | "error"
log_level: info
# Leave empty to log to stdout only. Set a path to also write to a file.
log_file: ""
