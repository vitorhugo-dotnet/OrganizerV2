name: Diagnose Vet

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vet-windows:
    runs-on: windows-latest
    steps:
      - name: Clone pull request branch and run vet
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch $env:HEAD_REF "https://x-access-token:$env:GH_TOKEN@github.com/$env:REPOSITORY.git" repo
          Set-Location repo
          go version
          go vet ./...
