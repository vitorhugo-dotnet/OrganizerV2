name: Diagnose Vet

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Clone pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: git clone --depth 1 --branch "$HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo

      - name: Regenerate module files
        working-directory: repo
        env:
          GOTOOLCHAIN: auto
        run: |
          rm -f go.sum
          go mod tidy

      - name: Upload regenerated module files
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-go-modules
          path: |
            repo/go.mod
            repo/go.sum
          if-no-files-found: error

      - name: Run vet with regenerated checksums
        working-directory: repo
        env:
          GOTOOLCHAIN: auto
        run: go vet ./...
